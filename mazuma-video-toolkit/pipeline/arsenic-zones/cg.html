 float H(vec2 p){float h=0.,a=1.,f=0.045; for(int i=0;i<5;i++){h+=a*noise(p*f+vec2(uTime*0.35*f*20.,uTime*0.22*f*20.)); a*=0.5; f*=2.1;} return h;}
 void main(){ vec2 p=vW.xz; float e=1.2; float hx=H(p+vec2(e,0))-H(p-vec2(e,0)); float hz=H(p+vec2(0,e))-H(p-vec2(0,e));

const kok=[V(cm.min.x+mid(0,cm.max.x-cm.min.x)*0.6,cm.max.y-10),V(mid(cr.min.x,cr.max.x)-20,mid(cr.min.y,cr.max.y)),V(cr.max.x-10,cr.max.y)];

// glowing river tubes

const NP=900; const pg=new THREE.BufferGeometry(); const pos=new Float32Array(NP*3); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const dot=document.createElement('canvas'); dot.width=dot.height=64; const d2=dot.getContext('2d'); const rg=d2.createRadialGradient(32,32,0,32,32,32); rg.addColorStop(0,'rgba(255,255,255,1)'); rg.addColorStop(0.3,'rgba(255,90,60,0.9)'); rg.addColorStop(1,'rgba(255,0,0,0)'); d2.fillStyle=rg; d2.fillRect(0,0,64,64);
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:16,map:new THREE.CanvasTexture(dot),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,color:0xff4030})); scene.add(pts);

const CAM={full:[-40,1750,1250,-40,-80],north:[-340,800,-330,-340,-900],isan:[230,800,-180,230,-700],watch:[380,800,200,380,-340],central:[-150,680,520,-150,60],south:[520,560,440,560,40],all:[-30,1850,1350,-30,-80]};

// starfield
{const sg=new THREE.BufferGeometry(),sp=new Float32Array(1500*3);for(let i=0;i<1500;i++){sp[i*3]=(Math.random()-.5)*6000;sp[i*3+1]=-200-Math.random()*600;sp[i*3+2]=(Math.random()-.5)*6000;}sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
 }
// As atom (used in 'atom' stage)

const nuc=new THREE.Mesh(new THREE.SphereGeometry(60,48,48),new THREE.MeshStandardMaterial({color:0xff3b30,emissive:0xaa1100,emissiveIntensity:1.2,metalness:0.4,roughness:0.3})); atom.add(nuc);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(dot),color:0xff5040,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false})); halo.scale.set(300,300,1); atom.add(halo);
const orbits=[];for(let i=0;i<3;i++){const o=new THREE.Group();o.rotation.set(i*1.05,i*0.7,0);const rg=new THREE.Mesh(new THREE.TorusGeometry(180+i*40,1.6,8,160),new THREE.MeshBasicMaterial({color:0xffb199,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending}));o.add(rg);
 const el=new THREE.Mesh(new THREE.SphereGeometry(12,20,20),new THREE.MeshBasicMaterial({color:0xffffff}));el.position.x=180+i*40;o.add(el);const eh=halo.clone();eh.scale.set(90,90,1);el.add(eh);atom.add(o);orbits.push(o);}
const earthTex=await TL.loadAsync('sat/earth.jpg'); earthTex.colorSpace=THREE.SRGBColorSpace;

const atm=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture((()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const r=x.createRadialGradient(128,128,90,128,128,128);r.addColorStop(0,'rgba(80,160,255,0)');r.addColorStop(0.72,'rgba(80,160,255,0.0)');r.addColorStop(0.8,'rgba(110,190,255,0.85)');r.addColorStop(1,'rgba(80,160,255,0)');x.fillStyle=r;x.fillRect(0,0,256,256);return c;})()),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
atm.scale.set(GR*2.95,GR*2.95,1); globe.add(atm);

const dirOf=(lat,lon)=>{const ph=(lon+180)/360*2*Math.PI, la=lat*Math.PI/180; return new THREE.Vector3(-Math.cos(ph)*Math.cos(la),Math.sin(la),Math.sin(ph)*Math.cos(la));};

const TH={'57':'เชียงราย','50':'เชียงใหม่','58':'แม่ฮ่องสอน','42':'เลย','43':'หนองคาย','38':'บึงกาฬ','48':'นครพนม','49':'มุกดาหาร','37':'อำนาจเจริญ','34':'อุบลราชธานี','10':'กรุงเทพฯ'};

  const cv=document.createElement('canvas'); cv.width=512; cv.height=128; const x=cv.getContext('2d');
  x.font='800 64px K'; const w=x.measureText(nm).width+56; const z=m.userData.z; const col=z==='r'?'#ff3b30':z==='o'?'#ff9f0a':'#30d158';

  x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(nm,256,66);

window.cg=function(t,stage,u,D,prev){ if(stage==='atomdark') stage='atom';

    const dist=lerp(2300,760,k); cam.position.copy(globe.position).add(d.clone().multiplyScalar(dist)); cam.up.set(0,1,0); cam.lookAt(globe.position.clone().add(th.clone().multiplyScalar(GR*k*0.9)));

  globe.visible=false;

    Object.values(pillars).forEach(p=>p.visible=false); scene.children.forEach(c=>{if(c.isMesh&&c.geometry.type==='TubeGeometry')c.visible=false;});
    cam.position.set(Math.sin(t*0.5)*160,90,980); cam.lookAt(0,0,0); const s=ease(cl(u/0.6)); atom.scale.setScalar(0.2+0.8*s);
    orbits.forEach((o,i)=>{o.rotation.z=t*(1.4+i*0.5); o.rotation.y=i*0.7+t*0.2;}); nuc.rotation.y=t; halo.material.opacity=0.6+0.3*Math.sin(t*5);

  map.visible=true; grid.visible=false; water.visible=true; ctxP.visible=true; sat.visible=true; waterMat.uniforms.uTime.value=t; pts.visible=true; ring.visible=true; atom.visible=false;

  for(const m of provs){ const z=m.userData.z; let on=(z==='r'&&showR)||(z==='o'&&showO)||(z==='g'&&showG);
    if(stage==='north'&&z==='r'&&!['57','50','58'].includes(m.userData.code)) on=false;
    const delay=(ORDER[m.userData.code]||0)*0.18; const e=on?ease(cl((u-0.3-delay)/0.6)):0;
