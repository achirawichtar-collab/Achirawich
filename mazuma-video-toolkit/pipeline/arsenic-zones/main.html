<!doctype html><html lang="th"><head><meta charset="utf-8"><script src="timeline.js"></script><style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:K;color:#fff}

.tl{left:40px;top:170px;border-right:0;border-bottom:0}.tr{right:40px;top:170px;border-left:0;border-bottom:0}.bl{left:40px;bottom:250px;border-right:0;border-top:0}.br{right:40px;bottom:250px;border-left:0;border-top:0}
#scan{position:absolute;left:0;right:0;height:160px;background:linear-gradient(180deg,transparent,rgba(140,215,255,.12),transparent)}

.L{position:absolute;inset:0;display:none}
.big{position:absolute;left:40px;right:40px;top:250px;text-align:center;font-weight:800;font-size:100px;line-height:1.1;text-shadow:0 0 30px rgba(0,0,0,.9),0 6px 0 rgba(0,0,0,.5)}
.big b{color:#ff3b30}.big i{font-style:normal;color:#ff9f0a}.big u{text-decoration:none;color:#30d158}.big em{font-style:normal;color:#ffd23f}
.loc{position:absolute;left:60px;top:260px;background:rgba(0,0,0,.6);border-left:12px solid #ff3b30;font-weight:800;font-size:56px;padding:14px 28px;border-radius:12px;backdrop-filter:blur(4px)}
.loc small{display:block;font-size:34px;font-weight:600;color:#ffd23f}
.chips{position:absolute;left:90px;right:90px;top:1080px;display:flex;flex-direction:column;gap:20px}
.chips div{background:rgba(5,15,25,.78);border:3px solid rgba(255,255,255,.25);border-radius:22px;font-weight:800;font-size:50px;padding:16px 28px}
.cnt{position:absolute;left:0;right:0;top:640px;text-align:center;font-weight:800}
.cnt .n{font-size:320px;line-height:1;color:#ff3b30;text-shadow:0 0 60px rgba(255,40,40,.8),0 8px 0 rgba(0,0,0,.5)}
.cnt .u{font-size:90px}
.badge{position:absolute;left:70px;right:70px;top:1000px;background:rgba(10,40,20,.82);border:4px solid #30d158;border-radius:30px;padding:26px 30px;font-weight:800;font-size:48px;text-align:center;box-shadow:0 0 50px rgba(48,209,88,.5)}
.badge small{display:block;font-size:30px;font-weight:600;color:#bff5cc}
.card{position:absolute;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);color:#111;text-align:center}
.card img{width:100%;display:block}.card div{font-weight:800;font-size:28px;padding:8px 6px 12px;background:#0b1626;color:#fff}
#cap{position:absolute;left:50px;right:50px;top:1450px;text-align:center;font-weight:600;font-size:50px;line-height:1.25;text-shadow:0 0 10px #000,0 3px 4px #000;-webkit-text-stroke:1.5px rgba(0,0,0,.6)}
#cred{position:absolute;right:40px;top:1640px;max-width:700px;text-align:right;background:rgba(0,0,0,.55);font-weight:600;font-size:22px;padding:5px 14px;border-radius:10px}
#brand{position:absolute;right:40px;top:120px;font-weight:800;font-size:30px;letter-spacing:4px;opacity:.8}
</style></head><body>
<iframe id="cgf" src="cg.html"></iframe>
<div id="root"></div>
<div id="scan"></div><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
<div id="data"></div><div id="vig"></div><div id="grain"></div><div id="cap"></div><div id="cred"></div><div id="bar1"></div><div id="bar2"></div><div id="brand">MAZUMA</div><div id="flash"></div>
<script>
const OV={
 hook:'<div class="big">สารหนู<br><b>ไหลไปถึงไหนแล้ว?</b></div>',
 mine:'<div class="loc">⛏️ ต้นตอ<small>เหมืองแร่ต้นน้ำ ฝั่งเมียนมา</small></div>',
 zones:'<div class="big" style="font-size:90px">แบ่งได้ <em>3 โซน</em></div><div class="chips"><div>🔴 ได้รับผลกระทบแล้ว</div><div>🟠 ควรเฝ้าระวัง</div><div>🟢 ไม่อยู่ในเส้นทางน้ำ</div></div>',
 north:'<div class="big" style="font-size:76px"><b>🔴 โซนแดง</b> · ภาคเหนือ</div>',
 gt:'<div class="loc">📍 สามเหลี่ยมทองคำ<small>แม่น้ำสาย · กก · รวก → โขง</small></div>',
 salween:'<div class="loc">📍 แม่น้ำสาละวิน<small>จ.แม่ฮ่องสอน</small></div>',
 isan:'<div class="big" style="font-size:76px"><b>🔴 โซนแดง</b> · อีสานตอนบน</div>',
 nk:'<div class="loc">📍 แม่น้ำโขง<small>จ.หนองคาย</small></div>',
 ddc:'<div class="loc" style="border-color:#ffd23f">กรมควบคุมโรค<small>ตรวจปัสสาวะกลุ่มเสี่ยง ภาคเหนือ–อีสาน</small></div>',
 atom:'<div class="cnt"><span class="n" id="n94">0</span><span class="u"> คน</span><div style="font-size:52px">สารหนูในร่างกาย<br>เกินค่าอ้างอิง</div></div>',
 watch:'<div class="big" style="font-size:76px"><i>🟠 โซนส้ม</i> · ควรเฝ้าระวัง</div>',
 south:'<div class="big" style="font-size:80px">ถ้าต้นทาง<br><b>ยังไม่หยุด…</b></div><div class="chips" style="top:1150px"><div>⬇️ ตะกอนอาจไหลตามน้ำโขง</div></div>',
 central:'<div class="big" style="font-size:72px"><u>🟢 โซนเขียว</u> · ไม่อยู่ในเส้นทางน้ำ</div><div class="chips" style="top:1150px"><div>ภาคกลาง · กทม. · ตะวันออก · ตะวันตก · ใต้</div></div>',
 bkk1:'<div class="loc" style="border-color:#30d158">📍 กรุงเทพมหานคร<small>แม่น้ำเจ้าพระยา</small></div>',
 mwa:'<div class="badge">✅ กปน. ยืนยัน<br>น้ำประปา กทม.–นนทบุรี–สมุทรปราการ<br>ไม่ได้รับผลกระทบ<small>การประปานครหลวง · 16 พ.ย. 2569</small></div>',
 fish:'<div class="big" style="font-size:96px">⚠️ แต่ระวัง<br><b>ปลาแม่น้ำ</b></div>',
 farm:'<div class="big" style="font-size:88px">& ผลผลิตเกษตร<br><em>จากจังหวัดเสี่ยง</em></div>',
 tap:'<div class="big" style="font-size:92px">บ้านอยู่<br><b>โซนแดง</b>–<i>ส้ม</i>?</div>',
 prod:'<div class="big" style="font-size:80px">น้ำดื่มผ่าน <em>RO</em><br>ช่วยลดสารหนู + โลหะหนัก</div><div id="cards"></div>',
 official:'<div class="big" style="font-size:86px">📢 ติดตาม<br><em>ประกาศทางการ</em></div>',
 cta:'<div class="big" style="font-size:86px">📌 เซฟไว้<br>แชร์ให้คน<b>โซนแดง</b>–<i>ส้ม</i></div><div class="chips" style="top:1120px"><div>💬 คอมเมนต์จังหวัดของคุณ</div></div>',
};
const PR=[['RO-Ultra-400GPD_open_1500x1500','RO ULTRA 400 GPD'],['RoMagicCube-X3_2_1000x1000-1','ANGEL RO MAGIC CUBE X3'],['RO-Ultra-400GPF_1500x1500','RO ULTRA 400 GPD']];
const root=document.getElementById('root');
TL.S.forEach((s,i)=>root.insertAdjacentHTML('beforeend',`<div class="L" id="L${i}">${OV[s.ov]||''}</div>`));
document.querySelectorAll('#cards').forEach(c=>c.innerHTML=PR.map((p,j)=>`<div class="card" style="left:${[60,390,720][j]}px;top:${[820,760,820][j]}px;width:300px"><img src="prod/${p[0]}.jpg"><div>${p[1]}</div></div>`).join(''));
const cl=x=>Math.max(0,Math.min(1,x)),back=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},out=x=>1-Math.pow(1-cl(x),3);
window.ready=()=>{const w=document.getElementById('cgf').contentWindow;return w&&w.cgReady;};
window.frame=function(t){
 let i=TL.S.findIndex(s=>t>=s.a&&t<s.b); if(i<0)i=TL.S.length-1; const s=TL.S[i],u=t-s.a,D=s.b-s.a;
 const f=document.getElementById('cgf');
 if(s.cg){ f.style.display='block'; const pv=TL.S[i-1]; const prev=(pv&&pv.cg&&!['globe','atom','atomdark'].includes(pv.cg)&&!['atom','atomdark'].includes(s.cg)&&u<1.2)?pv.cg:s.cg; f.contentWindow.cg(t,s.cg,u,D,prev);} else f.style.display='none';
 document.querySelectorAll('.L').forEach((e,k)=>e.style.display=k===i?'block':'none');
 const L=document.getElementById('L'+i),q=c=>[...L.querySelectorAll(c)];
 q('.big').forEach(b=>{const k=Math.min(1,u/0.32);b.style.opacity=k;b.style.transform=`scale(${1.25-0.25*out(k)})`;b.style.letterSpacing=`${(1-k)*16}px`;b.style.filter=`blur(${(1-k)*10}px)`;});
 q('.loc').forEach(b=>{const k=back((u-0.1)/0.35);b.style.transform=`translateX(${(1-k)*-800}px)`;});
 q('.chips div').forEach((c,j)=>{const k=back((u-0.4-j*0.25)/0.3);c.style.transform=`translateX(${(1-k)*-1000}px)`;});
 q('.badge').forEach(b=>{const k=back((u-0.2)/0.35);b.style.transform=`scale(${k})`;b.style.opacity=cl((u-0.2)/0.1);});
 const n=L.querySelector('#n94'); if(n) n.textContent=Math.round(94*out((u-0.2)/1.3));
 q('.cnt').forEach(b=>b.style.transform=`translate(${Math.sin(t*60)*5*(u<1.6?1:0)}px,0)`);
 q('.card').forEach((c,j)=>{const k=back((u-0.3-j*0.18)/0.35);const hl=Math.floor(u/0.5)%3===j;c.style.transform=`perspective(900px) rotateY(${(1-k)*80+Math.sin(t*1.5+j)*6}deg) translateY(${(1-k)*400}px) scale(${hl?1.08:0.96})`;c.style.opacity=cl((u-0.3-j*0.18)/0.1);c.style.boxShadow=hl?'0 0 60px rgba(90,209,255,.9)':'0 20px 50px rgba(0,0,0,.6)';});
 const c=TL.caps.find(c=>t>=c[0]&&t<c[1]); document.getElementById('cap').textContent=c?c[2]:'';
 document.getElementById('cred').textContent=s.cr;
 document.getElementById('flash').style.opacity=Math.max(0,.35-u*5)*(i>0?1:0);
 document.getElementById('scan').style.top=((t*650)%2300-200)+'px';
 document.getElementById('grain').style.backgroundPosition=`${(t*977)%220}px ${(t*613)%220}px`;
 document.getElementById('data').innerHTML=`LAT ${(20.27-t*0.12).toFixed(3)}°N · LON ${(100.08+t*0.09).toFixed(3)}°E<br>SCAN ${String(Math.floor(t*37)%1000).padStart(3,'0')} · As MONITOR`;
};
</script></body></html>
